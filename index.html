<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eaf4f3"><title>摸鱼模拟器</title><link rel="stylesheet" href="./style.css"></head>
<body>
<main id="app">
  <header class="topbar">
    <button id="home" class="brand" aria-label="返回当前鱼"><span class="brand-fish" aria-hidden="true">◁</span><span>摸鱼模拟器<small>给自己一点游离时间</small></span></button>
  </header>
  <div class="status-bar"><div class="today"><span class="live-dot"></span><span>今日已摸鱼</span><strong id="timer">00:00:00</strong></div><button id="rank-open" class="text-button" hidden>排行榜 <span aria-hidden="true">↗</span></button></div>
  <section id="gallery" class="gallery" aria-labelledby="gallery-title">
    <div class="gallery-heading"><div><p class="eyebrow">此刻，适合摸鱼</p><h1 id="gallery-title">鱼的名册</h1></div><p class="gallery-note">15 位海洋朋友<br>点开它，换个角度发呆。</p></div>
    <div id="fish-list" class="fish-list"></div>
    <footer class="gallery-footer"><span>不用赶路，游到哪里都好。</span><span>拖动旋转 · 自由切换动作</span></footer>
  </section>
  <section id="viewer" class="viewer" hidden aria-label="鱼的三维查看器">
    <div class="view-main">
      <div class="specimen-title"><span id="fish-number" class="eyebrow"></span><h1 id="fish-name"></h1></div>
      <div id="stage" tabindex="0" role="img" aria-label="拖动旋转鱼，双指缩放；键盘方向键旋转">
        <canvas id="scene"></canvas><img id="fallback-image" alt="当前鱼的静态预览" hidden>
        <div class="stage-ring" aria-hidden="true"></div>
      </div>
      <div id="load-state" role="status" hidden><span id="load-message"></span><button id="retry" hidden>重新加载</button></div>
      <nav class="fish-switch" aria-label="切换鱼"><button id="previous">← 上一条</button><button id="directory">鱼的名册 ☷</button><button id="next">下一条 →</button></nav>
    </div>
    <aside class="motion-panel"><p class="eyebrow">今天怎么摸</p><div id="motions"></div><p id="motion-hint">不赶时间，慢慢游</p><div class="panel-bottom"><button id="share-open" class="share-button">分享这一刻 ↗</button></div></aside>
  </section>
  <div id="modal" class="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header><h2 id="dialog-title"></h2><button id="modal-close" aria-label="关闭弹窗">×</button></header><div id="rank-panel" hidden><p id="rank-description">按今日累计摸鱼时长排名 · 北京时间每日重置</p><div id="rank-status" role="status"></div><ol id="rank-list"></ol><button id="rank-retry" hidden>重新加载榜单</button></div><div id="share-panel" hidden><img id="share-preview" alt="摸鱼时刻分享海报"><div class="share-copy"><h3>把这份悠闲分享出去</h3><p>带上今天的鱼和摸鱼时长，发一篇笔记。</p><button id="publish" class="share-button">发布小红书笔记</button><button id="native-share" class="text-button" hidden>分享小工具给朋友</button><p id="share-status" role="status"></p></div></div></section></div>
  <div id="toast" role="status" hidden></div>
  <span id="safe-probe" aria-hidden="true"></span>
</main>
<script src="./app.js"></script>
</body></html>
